name: Build .NET e Rodar Docker Compose

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'P@ssw0rd2024!' }}
          MSSQL_PID: Developer
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
    steps:
    - name: Checkout do código
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Aguardar SQL Server estar pronto
      run: |
        for i in {1..30}; do
          if nc -z localhost 1433 2>/dev/null; then
            echo "SQL Server está pronto!"
            exit 0
          fi
          echo "Aguardando SQL Server... tentativa $i/30"
          sleep 2
        done
        echo "SQL Server não ficou pronto"
        exit 1
      shell: bash

    - name: Configurar o SDK do .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Configurar o Java 21
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Cache dos pacotes do SonarCloud
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache do SonarScanner para .NET
      id: cache-sonar-scanner
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./.sonar/scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Instalar o SonarScanner para .NET
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      run: |
        mkdir -p ./.sonar/scanner
        dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

    - name: Iniciar a análise do SonarCloud
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      run: >
        ./.sonar/scanner/dotnet-sonarscanner begin
        /k:"$SONAR_PROJECT_KEY"
        /o:"$SONAR_ORGANIZATION"
        /v:"${{ github.sha }}"
        /d:sonar.token="$SONAR_TOKEN"
        /d:sonar.host.url="https://sonarcloud.io"
        /d:sonar.sources=src
        /d:sonar.tests=test
        /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**"
        /d:sonar.test.inclusions="test/**/*Test.cs,test/**/*Tests.cs"
        /d:sonar.coverage.exclusions="**/Migrations/**,**/obj/**,**/bin/**,test/**,infra/database/**,src/EduOnline.Api.Status/Program.cs,src/EduOnline.Core.Api/Extensions/ObservabilityExtensions.cs,src/EduOnline.Core.Api/Extensions/PollyExtensions.cs,src/EduOnline.Alunos.Domain/Models/Matricula.cs,src/EduOnline.Alunos.Domain/Models/Certificado.cs,src/EduOnline.Alunos.ApiRest/Controllers/AlunoController.cs"
        /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"
        /d:sonar.issue.ignore.multicriteria="k8sstatus1,k8sstatus2"
        /d:sonar.issue.ignore.multicriteria.k8sstatus1.ruleKey="kubernetes:S6596"
        /d:sonar.issue.ignore.multicriteria.k8sstatus1.resourceKey="infra/kubernetes/deployments/status-api-deployment.yaml"
        /d:sonar.issue.ignore.multicriteria.k8sstatus2.ruleKey="kubernetes:S5332"
        /d:sonar.issue.ignore.multicriteria.k8sstatus2.resourceKey="infra/kubernetes/deployments/status-api-deployment.yaml"
    
    - name: Restaurar dependências e Build da Solução
      run: dotnet build EduOnline.slnx --configuration Release

    - name: Validar formatação (whitespace)
      run: dotnet format whitespace EduOnline.slnx --no-restore --verify-no-changes

    - name: Executar Testes de Unidade
      shell: bash
      run: |
        set -euo pipefail
        shopt -s globstar nullglob
        for project in test/**/*.csproj; do
          if [[ "$project" == *UnitTest.csproj ]]; then
            echo "Executando unit tests em $project"
            dotnet test "$project" --configuration Release --no-build --collect:"XPlat Code Coverage;Format=opencover"
          fi
        done

    - name: Executar Testes de Integração
      shell: bash
      run: |
        set -euo pipefail
        shopt -s globstar nullglob
        for project in test/**/*.csproj; do
          if [[ "$project" == *IntegrationTest.csproj ]]; then
            echo "Executando integration tests em $project"
            dotnet test "$project" --configuration Release --no-build --collect:"XPlat Code Coverage;Format=opencover" --logger "trx;LogFileName=integration-tests.trx"
          fi
        done

    - name: Consolidar cobertura e aplicar gate progressivo
      shell: bash
      run: |
        set -euo pipefail
        dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.10
        export PATH="$PATH:$HOME/.dotnet/tools"

        reportgenerator \
          -reports:"**/TestResults/**/coverage.opencover.xml" \
          -targetdir:"TestResults/CoverageSummary" \
          -reporttypes:"TextSummary"

        cat TestResults/CoverageSummary/Summary.txt

        branch_coverage=$(grep -E "Branch coverage:" TestResults/CoverageSummary/Summary.txt | sed -E 's/.*Branch coverage: ([0-9.]+)%.*/\1/')
        threshold=27.0

        echo "Branch coverage atual: ${branch_coverage}%"
        echo "Threshold progressivo: ${threshold}%"

        awk -v actual="$branch_coverage" -v min="$threshold" 'BEGIN { if (actual + 0 < min + 0) exit 1 }' || {
          echo "Cobertura de branches abaixo do threshold progressivo."
          exit 1
        }

    - name: Smoke de Observabilidade (HealthChecks)
      run: >
        dotnet test EduOnline.slnx --configuration Release --no-build
        --filter "FullyQualifiedName~HealthChecksIntegrationTest"

    - name: Validar manifestos de observabilidade do Kubernetes
      shell: pwsh
      run: ./scripts/validate-observability.ps1

    - name: Finalizar a análise do SonarCloud
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  build-push-images:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        include:
          - imagem: andrecesco/eduonline-auth-api
            dockerfile: src/EduOnline.Auth.ApiRest/Dockerfile
          - imagem: andrecesco/eduonline-conteudos-api
            dockerfile: src/EduOnline.Conteudos.ApiRest/Dockerfile
          - imagem: andrecesco/eduonline-alunos-api
            dockerfile: src/EduOnline.Alunos.ApiRest/Dockerfile
          - imagem: andrecesco/eduonline-pagamentos-api
            dockerfile: src/EduOnline.Pagamentos.ApiRest/Dockerfile
          - imagem: andrecesco/eduonline-bff
            dockerfile: src/EduOnline.WebApps.ApiRest/Dockerfile
          - imagem: andrecesco/eduonline-status
            dockerfile: src/EduOnline.Api.Status/Dockerfile

    steps:
    - name: Checkout do código
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configurar o Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Fazer Login no Docker Hub
      uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build e Push da imagem ${{ matrix.imagem }}
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: true
        tags: |
          ${{ matrix.imagem }}:${{ github.sha }}
          ${{ matrix.imagem }}:latest

  docker-compose:
    needs: build-push-images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'P@ssw0rd2024!' }}

    steps:
    - name: Checkout do código
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Fazer Login no Docker Hub
      uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Baixar as imagens publicadas no Docker Hub
      run: docker compose pull

    - name: Subir o Docker Compose completo
      shell: bash
      run: |
        set -euo pipefail

        docker compose up -d || true

        for i in {1..36}; do
          status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' eduonline-sqlserver 2>/dev/null || echo missing)
          echo "Status health sqlserver: $status (tentativa $i/36)"

          if [[ "$status" == "healthy" ]]; then
            break
          fi

          sleep 5
        done

        final_status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' eduonline-sqlserver 2>/dev/null || echo missing)
        if [[ "$final_status" != "healthy" ]]; then
          docker compose ps
          docker logs eduonline-sqlserver --tail 200 || true
          exit 1
        fi

        docker compose up -d

    - name: Verificar saúde dos serviços do Docker Compose
      shell: pwsh
      run: |
        $services = docker compose ps --format json | ConvertFrom-Json
        $failed = @()

        foreach ($service in $services) {
          if ($service.Service -eq 'sqlserver-init') {
            if ($service.State -ne 'exited' -or $service.ExitCode -ne 0) {
              $failed += $service
            }
            continue
          }

          if ($service.State -ne 'running') {
            $failed += $service
            continue
          }

          if ($service.PSObject.Properties.Name -contains 'Health' -and $service.Health -and $service.Health -ne 'healthy' -and $service.Health -ne 'starting') {
            $failed += $service
          }
        }

        if ($failed.Count -gt 0) {
          $failed | Format-Table Service,State,Health,ExitCode -AutoSize
          exit 1
        }

    - name: Verificar status dos containers
      run: docker compose ps
